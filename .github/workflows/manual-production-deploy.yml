name: Manual Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Choose YES only after reviewing the successful audit and approving production deployment"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
      target:
        description: "Choose which hosting provider to deploy"
        required: true
        type: choice
        options:
          - "vercel"
          - "netlify"

permissions:
  actions: read
  contents: read

concurrency:
  group: manual-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'YES' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require successful audit for exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi
          RUNS="$(gh api "repos/$REPOSITORY/actions/workflows/ai-checker.yml/runs?branch=main&per_page=50")"
          MATCH="$(printf '%s' "$RUNS" | python -c 'import json,sys,os; d=json.load(sys.stdin); sha=os.environ["GH_SHA"]; runs=[r for r in d.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("status")=="completed" and r.get("conclusion")=="success"]; print("yes" if runs else "no")')"
          if [ "$MATCH" != "yes" ]; then
            echo "::error::No successful AI audit was found for the exact commit selected for deployment. Run and pass the audit first."
            exit 1
          fi
          echo "Successful audit found for commit $GH_SHA."

      - name: Deploy to Vercel only after explicit approval
        if: ${{ inputs.target == 'vercel' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is missing."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK"
          echo "Vercel deployment hook accepted the request."

      - name: Deploy to Netlify only after explicit approval
        if: ${{ inputs.target == 'netlify' }}
        env:
          DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::NETLIFY_DEPLOY_HOOK secret is missing."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK"
          echo "Netlify deployment hook accepted the request."

      - name: Deployment request audit log
        if: always()
        run: |
          echo "Manual deployment workflow completed."
          echo "Target: ${{ inputs.target }}"
          echo "Approved by workflow input: ${{ inputs.confirm_deploy }}"
          echo "Selected commit: ${{ github.sha }}"
          echo "Note: a hook response confirms the deployment request was accepted, not that the live site passed smoke tests."
