name: Universal Project Audit and Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Audit runs are read-only with respect to the repository.
# Production deployment must be controlled separately in the hosting provider.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: project-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For pull requests, test the proposed merge result.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run initial project checks
        id: static_before
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p audit-reports
          set +e
          python .github/scripts/static_check.py 2>&1 | tee audit-reports/initial-static-check.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: AI audit and bounded repair
        id: ai_repair
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set +e
          mkdir -p audit-reports
          for ATTEMPT in 1 2 3; do
            echo "=== AI audit attempt ${ATTEMPT}/3 ==="
            python .github/scripts/review.py 2>&1 | tee "audit-reports/ai-audit-${ATTEMPT}.txt"
            AUDIT_STATUS=${PIPESTATUS[0]}
            if [ "$AUDIT_STATUS" -eq 0 ]; then
              break
            fi
            python .github/scripts/auto_fix.py 2>&1 | tee -a "audit-reports/ai-audit-${ATTEMPT}.txt"
            FIX_STATUS=${PIPESTATUS[0]}
            if [ "$FIX_STATUS" -ne 0 ]; then
              echo "Repair attempt failed; will re-audit and report."
            fi
          done

          echo "=== Final deterministic checks ==="
          python .github/scripts/static_check.py 2>&1 | tee audit-reports/final-static-check.txt
          STATIC_STATUS=${PIPESTATUS[0]}

          echo "=== Final AI audit ==="
          python .github/scripts/review.py 2>&1 | tee audit-reports/final-ai-audit.txt
          AI_STATUS=${PIPESTATUS[0]}

          # Save proposed working-tree changes for human review; never commit or deploy them.
          git diff -- projects/ > audit-reports/proposed-repair.patch
          git status --short > audit-reports/changed-files.txt

          if [ "$STATIC_STATUS" -eq 0 ] && [ "$AI_STATUS" -eq 0 ]; then
            echo "final_status=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "final_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Create readable report and GitHub summary
        if: always()
        env:
          INITIAL_CHECK: ${{ steps.static_before.outcome }}
          AUDIT_STEP: ${{ steps.ai_repair.outcome }}
          FINAL_STATUS: ${{ steps.ai_repair.outputs.final_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          reports = Path("audit-reports")
          reports.mkdir(exist_ok=True)

          def read_log(name, limit=8000):
              p = reports / name
              if not p.exists():
                  return "এই ধাপের লগ তৈরি হয়নি।"
              data = p.read_text(encoding="utf-8", errors="replace").strip()
              if not data:
                  return "লগ ফাইল খালি।"
              if len(data) > limit:
                  data = data[-limit:] + "\n[শেষ অংশ দেখানো হয়েছে; সম্পূর্ণ লগ artifact-এ আছে।]"
              return data

          status = os.getenv("FINAL_STATUS", "unknown")
          if status == "passed":
              verdict = "## ফলাফল: প্রাথমিক পরীক্ষায় পাস\nনির্ধারিত checks পাস করেছে। এটি সম্পূর্ণ ত্রুটিমুক্তির নিশ্চয়তা নয়।"
          elif status == "failed":
              verdict = "## ফলাফল: মার্জ করার আগে সমস্যা সমাধান দরকার\nচূড়ান্ত পরীক্ষা পাস করেনি। নিচের লগ ও patch পরীক্ষা করুন।"
          else:
              verdict = "## ফলাফল: অসম্পূর্ণ\nচূড়ান্ত ফলাফল তৈরি হয়নি; workflow error log দেখুন।"

          lines = [
              "# Project Audit Report", "", verdict, "",
              "## রান-এর তথ্য",
              "- Repository: " + os.getenv("GITHUB_REPOSITORY", "unknown"),
              "- Branch: " + os.getenv("BRANCH_NAME", "unknown"),
              "- Commit: " + os.getenv("COMMIT_SHA", "unknown"),
              "- প্রাথমিক static check: " + os.getenv("INITIAL_CHECK", "unknown"),
              "- Audit/repair ধাপ: " + os.getenv("AUDIT_STEP", "unknown"),
              "- GitHub Actions রান: " + os.getenv("RUN_URL", "লিংক নেই"), "",
              "## ১. চূড়ান্ত static check", read_log("final-static-check.txt"), "",
              "## ২. চূড়ান্ত AI audit — সমস্যা ও প্রস্তাবিত সমাধান",
              read_log("final-ai-audit.txt"), "",
              "## ৩. প্রাথমিক পরীক্ষা", read_log("initial-static-check.txt", 3000), "",
              "## ৪. AI audit ও repair প্রচেষ্টার লগ"
          ]
          attempts = sorted(reports.glob("ai-audit-*.txt"))
          if attempts:
              for p in attempts:
                  lines.extend(["### " + p.name, read_log(p.name, 3000), ""])
          else:
              lines.append("AI audit/repair attempt-এর লগ পাওয়া যায়নি।")
          lines.extend([
              "## পরবর্তী করণীয়",
              "1. final-static-check.txt-এ syntax/check error দেখুন।",
              "2. final-ai-audit.txt-এ path, severity, problem ও suggested_fix দেখুন।",
              "3. proposed-repair.patch এবং changed-files.txt থাকলে পরিবর্তনগুলো নিজে পর্যালোচনা করুন।",
              "4. সব required checks পাস এবং পরিবর্তন অনুমোদিত না হওয়া পর্যন্ত PR merge করবেন না।",
              "5. Production deploy এই workflow করে না; Netlify-তে production branch/auto-publish আলাদাভাবে সেট করতে হবে.",
              "",
              "সীমাবদ্ধতা: AI audit সহায়ক পরীক্ষা; পূর্ণ নিরাপত্তা, build success বা runtime correctness-এর নিশ্চয়তা নয়."
          ])
          report = "\n".join(lines) + "\n"
          (reports / "report.md").write_text(report, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          print("Readable report created: audit-reports/report.md")
          PY

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-audit-report-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 30
