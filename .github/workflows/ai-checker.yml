name: AI Project Auto Fix & Audit

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - ".github/scripts/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-audit-fix:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: AI Project Audit
        run: |
          python .github/scripts/review.py

      - name: AI Auto Fix
        if: failure()
        run: |
          python .github/scripts/auto_fix.py

      - name: Show Changes
        run: |
          git status
          git diff --stat

      - name: Commit AI Fixes
        if: failure()
        run: |
          git config user.name "AI Project Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects/

          if git diff --cached --quiet; then
            echo "No AI fixes were created."
          else
            git commit -m "AI auto-fix project [skip ci]"
            git push
          fi

      - name: Final AI Audit
        run: |
          python .github/scripts/review.py

      - name: Send Gmail Success
        if: success()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_TO"]

          msg = EmailMessage()
          msg["Subject"] = "✅ AI Project - Audit Successful"
          msg["From"] = username
          msg["To"] = recipient

          msg.set_content("""
          AI PROJECT AUTOMATION

          ✅ Project audit completed successfully.
          ✅ AI checks completed.
          ✅ Automatic repair completed if required.
          ✅ Final audit passed.

          Repository:
          https://github.com/mtmanagement220/my-ai-projects

          -- AI Project Automation
          """)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(username, password)
              server.send_message(msg)

          print("Success email sent.")
          PY

      - name: Send Gmail Failure
        if: failure()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_TO"]

          msg = EmailMessage()
          msg["Subject"] = "❌ AI Project - Audit Failed"
          msg["From"] = username
          msg["To"] = recipient

          msg.set_content("""
          AI PROJECT AUTOMATION

          ❌ Final AI audit failed.

          The system attempted to inspect and repair the project,
          but the final verification did not pass.

          Check GitHub Actions for details:

          https://github.com/mtmanagement220/my-ai-projects/actions

          -- AI Project Automation
          """)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(username, password)
              server.send_message(msg)

          print("Failure email sent.")
          PY
