name: AI Project Auto Repair System

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - ".github/scripts/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-auto-repair:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # -----------------------------------------
      # AI AUDIT → AUTO FIX → RE-AUDIT
      # Maximum 3 repair attempts
      # -----------------------------------------

      - name: AI Audit and Auto Repair
        id: repair
        shell: bash
        run: |
          set +e

          FINAL_STATUS=1

          for ATTEMPT in 1 2 3
          do
            echo ""
            echo "========================================="
            echo "🤖 AI AUDIT ATTEMPT $ATTEMPT / 3"
            echo "========================================="

            python .github/scripts/review.py
            STATUS=$?

            if [ $STATUS -eq 0 ]; then
              echo ""
              echo "========================================="
              echo "✅ PROJECT PASSED AI AUDIT"
              echo "========================================="
              FINAL_STATUS=0
              break
            fi

            echo ""
            echo "❌ Problems detected."
            echo "🛠️ Starting AI Auto Repair..."

            python .github/scripts/auto_fix.py
            FIX_STATUS=$?

            if [ $FIX_STATUS -ne 0 ]; then
              echo "⚠️ AI repair process returned an error."
            fi

            echo ""
            echo "🔄 Repair attempt $ATTEMPT completed."
            echo "🔍 Project will be audited again..."
          done

          echo ""
          echo "========================================="
          echo "FINAL AUDIT"
          echo "========================================="

          python .github/scripts/review.py
          FINAL_STATUS=$?

          if [ $FINAL_STATUS -eq 0 ]; then
            echo "final_status=success" >> "$GITHUB_OUTPUT"
            echo "🎉 FINAL AUDIT PASSED"
          else
            echo "final_status=failed" >> "$GITHUB_OUTPUT"
            echo "❌ FINAL AUDIT FAILED"
          fi

          exit $FINAL_STATUS

      # -----------------------------------------
      # SAVE AI REPAIRS
      # -----------------------------------------

      - name: Commit AI Repairs
        if: ${{ success() }}
        run: |
          git config user.name "AI Project Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects/

          if git diff --cached --quiet; then
            echo "No file changes detected."
          else
            git commit -m "AI auto-repair project [skip ci]"
            git push
            echo "✅ AI repaired files committed."
          fi

      # -----------------------------------------
      # SUCCESS EMAIL
      # -----------------------------------------

      - name: Send Gmail Success
        if: ${{ success() }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_TO"]

          msg = EmailMessage()
          msg["Subject"] = "✅ AI Project Repaired & Verified"
          msg["From"] = username
          msg["To"] = recipient

          msg.set_content("""
          AI PROJECT AUTOMATION

          ✅ Project checked.
          🛠️ Automatic AI repair completed where necessary.
          🔄 Project was re-tested.
          ✅ Final AI audit passed.

          Repository:
          https://github.com/mtmanagement220/my-ai-projects

          -- AI Project Automation
          """)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(username, password)
              server.send_message(msg)

          print("Success email sent.")
          PY

      # -----------------------------------------
      # FAILURE EMAIL
      # -----------------------------------------

      - name: Send Gmail Failure
        if: ${{ failure() }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_TO"]

          msg = EmailMessage()
          msg["Subject"] = "❌ AI Project Could Not Be Repaired"
          msg["From"] = username
          msg["To"] = recipient

          msg.set_content("""
          AI PROJECT AUTOMATION

          ❌ The project did not pass the final AI audit.

          🛠️ The system attempted automatic repair up to 3 times.

          The project may require manual attention.

          GitHub Actions:
          https://github.com/mtmanagement220/my-ai-projects/actions

          -- AI Project Automation
          """)

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(username, password)
              server.send_message(msg)

          print("Failure email sent.")
          PY
